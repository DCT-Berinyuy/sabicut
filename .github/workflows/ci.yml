name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Rendering runs the ffmpeg binary (PRD §8); the tests make their clips with it.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | sed -n 1p
          for filter in zscale tonemap zoompan loudnorm afftdn acompressor xstack drawbox setparams overlay; do
            ffmpeg -hide_banner -filters | grep -qw "$filter" || { echo "::error::ffmpeg lacks the $filter filter"; exit 1; }
          done
      - name: Test
        run: cargo test --workspace --locked
